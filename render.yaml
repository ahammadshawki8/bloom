# Render Blueprint: Bloom backend (Fastify) + Postgres.
# Render → New → Blueprint → pick this repo. Then fill the "sync: false" secrets.
databases:
  - name: bloom-db
    databaseName: bloom
    plan: free

services:
  - type: web
    name: bloom-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bloom-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # e.g. https://bloom.vercel.app (any *.vercel.app preview is also allowed)
      - key: YOUCAM_API_KEY
        sync: false
      - key: YOUCAM_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_KEY
        sync: false
      - key: AGENT_MODEL
        value: openai/gpt-oss-120b
      - key: BUDGET_TOTAL
        value: "600"
      - key: BUDGET_SESSION
        value: "60"
